services:
  db:
    image: postgres:15
    container_name: maintenance-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - maintenance_net

  api:
    build: ./backend
    container_name: maintenance-api
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - db
    networks:
      - maintenance_net
      - traefik-public  # ★修正
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maintenance-api.rule=Host(`${DOMAIN_API}`)"
      - "traefik.http.routers.maintenance-api.entrypoints=websecure"
      - "traefik.http.routers.maintenance-api.tls=true"
      - "traefik.http.routers.maintenance-api.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.services.maintenance-api.loadbalancer.server.port=8000"
      - "traefik.docker.network=traefik-public"  # ★修正

networks:
  maintenance_net:  # これはコンテナ間の通信用（閉じられたLAN）
  traefik-public:   # これはTraefikと繋がる用（公道の出口）
    external: true
